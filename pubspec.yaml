name: alburhaan
description: "alburhaan"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: any
  json_annotation: ^4.4.0
  webview_flutter: ^4.0.7
  webview_flutter_android: ^3.13.0
  webview_flutter_platform_interface: ^2.10.0
  shared_preferences: ^2.1.1
  win32: ^5.14.0
  url_launcher: ^6.2.5
  shimmer: ^3.0.0
  fluttertoast: ^8.2.4
  image_picker: ^0.8.7+4
  qr_flutter: ^4.0.0
  path_provider: ^2.1.1
  share_plus: ^7.0.2
  flutter_nfc_kit: ^3.3.1
  nfc_manager: ^3.3.0
  audioplayers: ^6.5.0
  barcode_widget: ^2.0.4
  flutter_staggered_animations: ^1.1.1
  sensors_plus: ^5.0.1
  #google_maps_flutter: ^2.6.0 not comp with sdk.
  #flutter_vibrate: ^1.3.0 not comp with sdk.


  flutter_localizations:
    sdk: flutter
  easy_localization: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  cached_network_image: ^3.2.0
  build_runner: ^2.1.12
  json_serializable: ^6.2.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/


    - assets/lang/
    - assets/sounds/Failed.mp3
    - assets/sounds/Success.mp3


